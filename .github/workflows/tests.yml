name: Tests

on:
  push:
    branches:
      - master
      - "features/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (suite rápida)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Instalar uv y Python 3.10
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.10"
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --locked --group dev

      - name: Correr tests sin red
        run: uv run --no-sync pytest -m "not network"
