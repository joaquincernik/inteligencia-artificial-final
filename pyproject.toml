[project]
name = "capazeta"
version = "0.1.0"
description = "Asistente ciberseguridad multi-agente modular basado en LangGraph y LangChain"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "faiss-cpu>=1.15.1",
    "httpx>=0.28.1",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain[openai]>=1.4.4",
    "langgraph>=1.2.14",
    "python-dotenv>=1.2.4",
    "python-nmap>=0.7.1",
]

[project.scripts]
capazeta = "capazeta.main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
