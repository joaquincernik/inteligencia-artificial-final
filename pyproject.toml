[project]
name = "capazeta"
version = "0.1.0"
description = "Asistente ciberseguridad multi-agente modular basado en LangGraph y LangChain"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "faiss-cpu>=1.15.1",
    "httpx>=0.28.1",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain[openai]>=1.4.4",
    "langgraph>=1.2.14",
    "pandas>=2.3.3",
    "python-dotenv>=1.2.4",
    "python-nmap>=0.7.1",
    "reportlab>=5.1.0",
    "requests>=2.31",
    "rich>=15.0.0",
    "scikit-learn>=1.7.2",
]

[project.scripts]
capazeta = "capazeta.main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "network: escaneo real de Nmap; requiere --nmap-target",
]
